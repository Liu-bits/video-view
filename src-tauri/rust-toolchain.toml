# 工具链约定：这个 crate 用 stable 构建。
#
# 刻意**不钉死具体版本号**（例如 "1.77.0"），理由有两条：
#
#   1. 最低支持版本的唯一真相来源是 Cargo.toml 里的 `rust-version = "1.77"`。
#      在两个文件里各写一遍，迟早会不一致，而且不一致的时候没人知道该信哪个。
#   2. 钉死版本会让 rustc 的修复与安全更新进不来 —— 除非有人记得专门来改
#      这个文件。工具链文件一旦被当成「放那儿就行」的东西，它就会烂在那里。
#
# 这里固定的是**通道**：挡住「有人用 nightly 编出不同行为」这类不可复现问题。
# edition 2021 + stable 是这个项目的既定前提（见 CONTRIBUTING.md）。
[toolchain]
channel = "stable"
components = ["rustfmt", "clippy"]
