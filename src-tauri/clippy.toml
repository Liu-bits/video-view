# clippy 配置。
#
# 这里**只调阈值，不启用额外 lint 组**。
#
# 原因是当前的结构现实：app.rs 4431 行、单个 `impl App` 占 2080 行 93 个方法，
# ui.rs 2528 行。在这种文件上开激进 lint，输出会被「函数太长」「参数太多」
# 「认知复杂度高」这类噪音淹没，而它们真正指向的是**该拆文件**这个结构问题，
# 不是某一行代码写错了。用 lint 兜结构问题，只会训练人忽略 lint 输出。
#
# 拆分是单独的计划（见 NEXT.md），做完了再来收紧这里。

# 与 Cargo.toml 的 `rust-version = "1.77"` 保持一致。
# clippy 据此避免建议只有更新版本才支持的写法。
msrv = "1.77"

# 默认 7。Win32 辅助函数天然参数偏多（句柄 + 坐标 + 状态各占一个），
# 强行收进结构体反而把调用点拆得更碎、更难读。
too-many-arguments-threshold = 10

# 默认 250。windows crate 的类型名动辄三层路径，放宽一档。
type-complexity-threshold = 300

# 默认 25。窗口过程、菜单构建这类函数天然分支密集。
cognitive-complexity-threshold = 40
