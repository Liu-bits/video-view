[package]
name = "video-view"
version = "0.2.0"
description = "轻量级 Windows 桌面视频播放器，基于 libmpv 与原生 Win32 界面"
authors = ["VideoView contributors"]
license = "GPL-3.0-or-later"
edition = "2021"
rust-version = "1.77"

[lib]
name = "video_view_lib"
crate-type = ["rlib"]

[build-dependencies]
# 把图标与版本信息写进 exe 资源段。纯 Rust 实现，不依赖 rc.exe 在 PATH 上，
# 但需要装 Windows SDK；缺失时 build.rs 只告警不中断。
embed-resource = "3"

[dependencies]
# libmpv 运行时动态加载，不需要 bindgen / import lib
libloading = "0.8"
# 原生文件对话框（COM），不依赖任何 Web 界面
rfd = { version = "0.17", default-features = false }
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_Com",
  "Win32_System_LibraryLoader",
  "Win32_System_Ole",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  # HDROP / DragAcceptFiles / DragQueryFileW 所在模块
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
