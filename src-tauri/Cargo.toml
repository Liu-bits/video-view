[package]
name = "video-view"
version = "0.5.0"
description = "轻量级 Windows 桌面视频播放器，基于 libmpv 与原生 Win32 界面"
authors = ["VideoView contributors"]
license = "GPL-3.0-or-later"
edition = "2021"
rust-version = "1.77"

[lib]
name = "video_view_lib"
crate-type = ["rlib"]

[build-dependencies]
# 把图标与版本信息写进 exe 资源段。纯 Rust 实现，不依赖 rc.exe 在 PATH 上，
# 但需要装 Windows SDK；缺失时 build.rs 只告警不中断。
embed-resource = "3"

[dependencies]
# libmpv 运行时动态加载，不需要 bindgen / import lib
libloading = "0.8"
# 原生文件对话框（COM），不依赖任何 Web 界面
rfd = { version = "0.17", default-features = false }
windows = { version = "0.62", features = [
  "Win32_Foundation",
  # EnumDisplayDevicesW：诊断报告里要给出显卡名
  "Win32_Graphics_Gdi",
  # 语言判定：读安装器写入的注册表值 + 系统界面语言（GetUserDefaultUILanguage）
  "Win32_Globalization",
  # RegCreateKeyExW 的 SECURITY_ATTRIBUTES 参数类型在这里
  "Win32_Security",
  "Win32_System_Com",
  # 复制诊断报告到剪贴板
  "Win32_System_DataExchange",
  # GlobalAlloc / GlobalLock：剪贴板数据的跨进程内存
  "Win32_System_Memory",
  # 崩溃日志：SetUnhandledExceptionFilter / EXCEPTION_POINTERS
  # 注意 SetUnhandledExceptionFilter 本身被 gate 在 Win32_System_Kernel 后面
  "Win32_System_Diagnostics_Debug",
  "Win32_System_Kernel",
  "Win32_System_LibraryLoader",
  "Win32_System_Ole",
  "Win32_System_Registry",
  # GetLogicalProcessorInformationEx：按物理核枚举，取物理核数
  # （注意它不在 SystemServices 里，那是常量的聚集地）
  "Win32_System_SystemInformation",
  "Win32_System_SystemServices",
  # 日志目录：CreateDirectoryW / GetFileAttributesW
  "Win32_Storage_FileSystem",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  # HDROP / DragAcceptFiles / DragQueryFileW / SHGetKnownFolderPath（图片目录）
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
