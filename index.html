<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VideoView</title>
  </head>
  <body>
    <div id="app">
      <!-- mpv 的原生渲染窗口会覆盖在 #stage 上，这里只做占位与点击事件 -->
      <div id="stage">
        <div id="drop-hint">拖放视频文件到此处打开</div>
      </div>

      <div id="controls">
        <div id="track-row">
          <span id="time-current">00:00</span>
          <input id="seek" type="range" min="0" max="1000" value="0" step="1" />
          <span id="time-duration">00:00</span>
        </div>

        <div id="button-row">
          <button id="btn-open" title="打开文件 (Ctrl+O)">打开</button>
          <button id="btn-play" title="播放 / 暂停 (空格)">播放</button>
          <button id="btn-stop" title="停止">停止</button>
          <span class="spacer"></span>
          <span id="volume-icon" title="静音">音量</span>
          <input id="volume" type="range" min="0" max="100" value="100" step="1" />
          <span id="file-name"></span>
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
